<!doctype html>
<html lang="en">

<head>

    <title>Recommendations</title>

    <link rel="stylesheet" href="style.css">


    <!-- EmailJS -->
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

</head>


<body>


<header>

    <h1>Leave a recommendation! 🤘</h1>


    <nav>

        <div class="menu">

            <span>Menu ▼</span>


            <div class="dropdown">
                <a href="index.html">Home</a>
                <a href="Meet Mikey.html">Meet Mikey</a>
                <a href="upcoming gigs.html">Upcoming gigs and their locations</a>
                <a href="song-lyrics.html">Song Lyrics</a>
                <a href="Recommendations.html">Song recommendations</a>
            </div>

        </div>

    </nav>


</header>



<br><br><br>



<div class="review-box">


    <h2>Tell me what you think 🤘</h2>



    <form id="recommendation-form">



        <label>Name:</label>

        <input
            type="text"
            id="name"
            placeholder="Enter your name"
            required>



        <label>Social Name:</label>

        <input
            type="text"
            id="social_name"
            placeholder="Enter your username or nickname"
            required>



        <label>Your Recommendation:</label>

        <textarea
            id="recommendation"
            placeholder="Write your recommendation here..."
            required></textarea>



        <button type="submit">

            Submit Recommendation 🤘

        </button>



    </form>



</div>





<<script>

emailjs.init({
    publicKey: "wdmmyXn9ZC0WjfqQh"
});


document.getElementById("recommendation-form").addEventListener("submit", function(event) {

    event.preventDefault();


    let recommendationData = {

        name: document.getElementById("name").value,

        social_name: document.getElementById("social_name").value,

        recommendation: document.getElementById("recommendation").value

    };


    console.log("Data being sent:", recommendationData);



    emailjs.send(
        "service_4u514ef",
        "template_zye3d0d",
        recommendationData
    )

    .then(function(response) {

        console.log("SUCCESS:", response);

        alert("Thank you for your recommendation 🤘");

        document.getElementById("recommendation-form").reset();

    })


    .catch(function(error) {

        console.error("EMAILJS ERROR:", error);

        alert(
            "Email failed:\n\n" +
            error.text
        );

    });


});

</script>

<script>
const menu = document.querySelector(".menu");
const menuButton = document.querySelector(".menu > span");

menuButton.addEventListener("click", function(event) {
    event.stopPropagation();
    menu.classList.toggle("open");
});

document.addEventListener("click", function() {
    menu.classList.remove("open");
});

menu.addEventListener("click", function(event) {
    event.stopPropagation();
});
</script>
