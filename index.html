<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Home!</title>
    <link rel="stylesheet" href="style.css">

    <style>
        .content {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 50px;
            height: 70vh;
        }

        .welcome-text {
            max-width: 350px;
            font-size: 24px;
            line-height: 1.5;
            text-align: left;
        }

        .welcome-text h2 {
            margin-bottom: 15px;
        }

        .content img {
            width: 500px;
            height: auto;
        }
    </style>
</head>

<body>

<header>

    <h1>MikeyReset04</h1>

    <nav>
        <div class="menu">
            <span>Menu ▼</span>

            <div class="dropdown">
                <a href="index.html">Home</a>
                <a href="Meet Mikey.html">Meet Mikey</a>
                <a href="upcoming gigs.html">Upcoming gigs and their locations</a>
                <a href="song lyrics.html">Song Lyrics</a>
                <a href="Recommendations.html">Song recommendations</a>
            </div>

        </div>
    </nav>

</header>

<div class="content">

    <div class="welcome-text">
        <h2>Welcome!</h2>
        <p>
            Welcome to the official website of <strong>Mikey Reset!</strong>
            The pages on this site have information about his upcoming gigs,
            his song lyrics and more! Check it out!
        </p>
    </div>

    <img src="Mikey Photo1.jpeg"
         alt="Mikey Photo1">

</div>

<script>
const menu = document.querySelector(".menu");
const menuButton = document.querySelector(".menu > span");

menuButton.addEventListener("click", function(event) {
    event.stopPropagation();
    menu.classList.toggle("open");
});

document.addEventListener("click", function() {
    menu.classList.remove("open");
});

menu.addEventListener("click", function(event) {
    event.stopPropagation();
});
</script>
    
</body>

</html>
