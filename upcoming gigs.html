menuButton.addEventListener("click", function(event) {
    event.stopPropagation();
    menu.classList.toggle("open");
});

<script>
    /*
        ADD, REMOVE OR EDIT YOUR GIGS HERE
    */

    const gigs = [
        {
            venue: "The Shark",
            location: "Harlow",
            date: "Saturday 8 August 2026",
            latitude: 51.7739,
            longitude: 0.0810
        },
        {
            venue: "Example Venue Two",
            location: "London",
            date: "Friday 4 December 2026",
            latitude: 51.5074,
            longitude: -0.1278
        },


    async function initialiseGigMap() {
        const { Map, InfoWindow } =
            await google.maps.importLibrary("maps");

        const { AdvancedMarkerElement } =
            await google.maps.importLibrary("marker");

        const map = new Map(document.getElementById("gig-map"), {
            zoom: 6,
            center: {
                lat: 54.5,
                lng: -3
            },

            /*
                DEMO_MAP_ID works for testing.
                You can replace it with your own Google map ID later.
            */
            mapId: "DEMO_MAP_ID"
        });

        const bounds = new google.maps.LatLngBounds();
        const informationWindow = new InfoWindow();

        gigs.forEach(function (gig) {
            const position = {
                lat: gig.latitude,
                lng: gig.longitude
            };

            const marker = new AdvancedMarkerElement({
                map: map,
                position: position,
                title: gig.venue
            });

            marker.addListener("click", function () {
                informationWindow.setContent(`
                    <div class="map-information">
                        <h3>${gig.venue}</h3>
                        <p><strong>Location:</strong> ${gig.location}</p>
                        <p><strong>Date:</strong> ${gig.date}</p>

                        <a
                            href="https://www.google.com/maps/search/?api=1&query=${gig.latitude},${gig.longitude}"
                            target="_blank"
                            rel="noopener noreferrer"
                        >
                            Open in Google Maps
                        </a>
                    </div>
                `);

                informationWindow.open({
                    map: map,
                    anchor: marker
                });
            });

            bounds.extend(position);
        });

        /*
            Automatically sizes the map so every gig is visible.
        */

        if (gigs.length > 1) {
            map.fitBounds(bounds);
        } else if (gigs.length === 1) {
            map.setCenter(bounds.getCenter());
            map.setZoom(14);
        }
    }
</script>


    <script>
